<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lwrcs</title>
  <meta name="description" content="lwrcs: 3D animation, music videos and music. A desk, a CRT, and someone living inside it." />
  <meta property="og:title" content="lwrcs" />
  <meta property="og:description" content="3D animation, music videos and music." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#000008" />
  <link rel="preload" href="assets/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="app/app.css" />
  <link rel="modulepreload" href="vendor/three/three.module.min.js" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body class="loading">
  <div id="stage">
    <div id="screen" class="crt">
      <div id="desk">
        <div class="col col-l">
          <section class="win" id="w-site">
            <header><span>SITE:/</span><i class="b min"></i><i class="b x"></i></header>
            <ul id="folders" class="list" aria-label="Folders"></ul>
          </section>
          <section class="win" id="w-info">
            <header><span>INFO.TXT</span><i class="b min"></i><i class="b x"></i></header>
            <div id="info" aria-live="polite"></div>
            <div id="term"><p id="term-out"></p><p><span class="prompt">C:\&gt;</span><span id="term-in"></span><b class="caret">_</b></p></div>
          </section>
        </div>
        <section class="win" id="w-view">
          <header><span id="view-title">VIEW.EXE</span><i class="b min"></i><i class="b max"></i><button class="b x" id="view-close" aria-label="Close file"></button></header>
          <div id="view">
            <canvas id="inner" aria-label="lifetime, a halftone character who follows your cursor"></canvas>
            <div id="viewer"></div>
          </div>
        </section>
        <div class="col col-r">
          <section class="win" id="w-files">
            <header><span id="files-title">FILES:/</span><i class="b min"></i><i class="b x"></i></header>
            <ul id="files" class="list" aria-label="Files"></ul>
          </section>
          <section class="win" id="w-preview">
            <header><span>PREVIEW.BMP</span><i class="b min"></i><i class="b x"></i></header>
            <div id="preview"></div>
          </section>
          <section class="win" id="w-nav">
            <header><span>NAV.DIR</span><i class="b min"></i><i class="b x"></i></header>
            <ul id="nav" class="list"></ul>
          </section>
        </div>
      </div>
      <div id="boot" aria-hidden="true"></div>
      <div id="pcursor" aria-hidden="true"></div>
      <div class="fx" aria-hidden="true"></div>
    </div>
    <canvas id="room" aria-hidden="true"></canvas>
    <div id="tag" aria-hidden="true"></div>
  </div>

  <noscript>
    <div class="plain">
      <h1>lwrcs</h1>
      <p>Animator, director, musician.</p>
      <p><a href="visuals/index.html">Visuals</a> · <a href="music/index.html">Music</a> · <a href="https://www.instagram.com/lwrcs/">Instagram</a></p>
    </div>
  </noscript>

  <script type="module" src="app/main.js"></script>
</body>
</html>
