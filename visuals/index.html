<!DOCTYPE html>
<html lang="en">

<head>
    <base href="../">
    <title>lwrcs | Visuals</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="lwrcs — Visual portfolio showcasing 3D animation, music videos, and promotional work." />
    <meta property="og:title" content="lwrcs | Visuals" />
    <meta property="og:description" content="Visual portfolio showcasing 3D animation, music videos, and promotional work." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Loader Animation -->
    <div id="loader-wrapper" role="status" aria-label="Loading">
        <div class="blob">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <div class="content">
                <h2>Loading...</h2>
            </div>
        </div>
    </div>

    <!-- Navigation Desktop -->
    <div class="nav-wrap">
        <header>
            <h1 class="logo"><a href="index.html">lwrcs</a></h1>
            <nav aria-label="Main navigation">
                <ul></ul>
            </nav>
            <div class="nav-gradient"></div>
        </header>
    </div>

    <!-- Navigation Mobile -->
    <input type="checkbox" class="dropdown-toggle" id="dropdown-menu" aria-hidden="true" />
    <label for="dropdown-menu" class="dropdown-label" aria-label="Toggle navigation menu">
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </label>
    <ul class="dropdown-menu" role="navigation" aria-label="Mobile navigation"></ul>

    <!-- Tag Filter Section -->
    <div id="tag-filter-container">
        <div id="tag-filter">
            <button class="filter-button" data-tag="3d">3D Animation</button>
            <button class="filter-button" data-tag="mv">Music Videos</button>
            <button class="filter-button" data-tag="promo">Promotional</button>
            <button class="filter-button" data-tag="anim">Animation</button>
            <button class="filter-button" data-tag="comm">Commission</button>
            <button class="filter-button" data-tag="personal">Personal</button>
            <button class="filter-button" data-tag="logo">Logo Animation</button>
        </div>
    </div>

    <!-- Gallery Section -->
    <div id="gallery-container">
        <div id="gallery">

            <!-- Template for dynamically-rendered projects -->
            <template id="project-template">
                <div class="video-container">
                    <video class="vid" controls preload="none"></video>
                    <div class="caption"></div>
                    <div class="bottom-bar"></div>
                </div>
            </template>

        </div>

        <!-- Back to Top Button -->
        <button id="back-to-top" class="b2t-image" aria-label="Back to top">
            <img src="img/BacktoTop.png" alt="Back to Top" />
        </button>
    </div>

    <!-- JavaScript — loaded once, in correct dependency order -->
    <script src="js/config.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/renderProjects.js"></script>
    <script src="js/alternateGallery.js"></script>
    <script src="js/lazyLoad.js"></script>
    <script src="js/tagFilter.js"></script>
    <script src="js/vidClickPlay.js"></script>
    <script src="js/vidPause.js"></script>
    <script src="js/click.js"></script>
    <script src="js/b2t.js"></script>
    <script src="js/loader.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="js/youtubeOverlay.js"></script>
</body>

</html>
