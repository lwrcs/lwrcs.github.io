<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="description" content="lwrcs — Music production, releases, and audio work." />
    <meta property="og:title" content="lwrcs | Music" />
    <meta property="og:description" content="Music production, releases, and audio work." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Loader Animation -->
    <div id="loader-wrapper" role="status" aria-label="Loading">
        <div class="blob">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <div class="content">
                <h2>Loading...</h2>
            </div>
        </div>
    </div>

    <!-- Navigation Desktop -->
    <div class="nav-wrap">
        <header>
            <h1 class="logo"><a href="index.html">lwrcs</a></h1>
            <nav aria-label="Main navigation">
                <ul></ul>
            </nav>
            <div class="nav-gradient"></div>
        </header>
    </div>

    <!-- Navigation Mobile -->
    <input type="checkbox" class="dropdown-toggle" id="dropdown-menu" aria-hidden="true" />
    <label for="dropdown-menu" class="dropdown-label" aria-label="Toggle navigation menu">
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </label>
    <ul class="dropdown-menu" role="navigation" aria-label="Mobile navigation"></ul>

    <!-- Music Hero -->
    <section class="music-hero">
        <div class="music-hero-video-wrap">
            <video class="music-hero-video" autoplay muted loop playsinline>
                <source src="img/video/lifetime.mp4" type="video/mp4" />
            </video>
        </div>
        <div class="music-hero-fade"></div>
    </section>

    <!-- Track Info -->
    <section class="music-track">
        <div class="music-track-inner">
            <p class="music-track-label">Featured Track</p>
            <h2 class="music-track-title">lifetime</h2>
            <div class="music-track-links">
                <a href="https://open.spotify.com/track/6YG9Ks60OTQ7NoB5UskUvu?si=23edbcd10af34749" class="music-link music-link--spotify" target="_blank" rel="noopener noreferrer">Spotify</a>
                <a href="https://soundcloud.com/lwrcs/lifetime?si=b2ba7250e3514758bb1e21892dd752a3&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" class="music-link music-link--soundcloud" target="_blank" rel="noopener noreferrer">SoundCloud</a>
                <a href="https://music.apple.com/us/album/lifetime/1684156859?i=1684156863" class="music-link music-link--apple" target="_blank" rel="noopener noreferrer">Apple Music</a>
                <a href="https://itunes.apple.com/us/album/lifetime/1684156859?i=1684156863" class="music-link music-link--apple" target="_blank" rel="noopener noreferrer">iTunes</a>
            </div>
        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/menu.js"></script>
