<!doctype html><html><head><meta charset="utf-8"><title>inner</title>
<style>html,body{margin:0;background:#111}canvas{display:block;width:442px;height:627px}</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.min.js","three/addons/":"../../vendor/three/addons/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { InnerView } from '../inner.js';
const Q = new URLSearchParams(location.search);
const gltf = await new GLTFLoader().loadAsync(Q.get('model') || '../../assets/models/lifetime.glb');
let moves = Object.fromEntries(gltf.animations.filter(c => c.name.startsWith('lifetime_')).map(c => [c.name.slice(9), c]));
if (!moves.idle) moves = await (await fetch('../../assets/models/lifetime-moves.json')).json();
const v = new InnerView(document.getElementById('c'), gltf.scene, { moves });
if (location.search.includes('blue')) (await import('../halftone.js')).blueU.value = 1;
window.v = v; window.__nm = new THREE.MeshNormalMaterial();
let t = 0;
// deterministic stepping for screenshots: window.sim(seconds, x, y)
window.sim = (secs, x, y) => { for (let i = 0; i < secs * 60; i++) { t += 1/60; if (x !== undefined) v.setPointerNDC(x, y, true); v.update(1/60, t); } };
window.sim(0.1);
addEventListener('pointermove', e => v.setPointerClient(e.clientX, e.clientY));
addEventListener('pointerdown', () => v.poke());
let last = performance.now();
if (!location.search.includes('static')) (function loop(now){ requestAnimationFrame(loop); const dt=(now-last)/1000; last=now; t+=dt; v.update(dt, t); })(last);
window.__ready = true;
</script></body></html>
